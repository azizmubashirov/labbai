name: CI

# One pipeline per push to main. Checks and image builds run in parallel:
#   tsc ─┐
#   tests (3 shards) ─┼─> promote (:sha -> :latest) ─> report
#   next-build ─┤
#   images (4, pushed as :sha) ─┘
# Deploys pull :latest, which only moves once every check and every image passed.
# Results are published to the public `ci-reports` / `ci-build-report` branches
# (job logs need repo-admin auth).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  BUN_VERSION: 1.4.1

jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p out
          bun install --frozen-lockfile 2>&1 | tee out/install.txt

      - name: Type check (apps/labbai)
        id: tsc
        working-directory: apps/labbai
        run: |
          set -o pipefail
          NODE_OPTIONS=--max-old-space-size=12288 bunx tsc --noEmit --pretty false 2>&1 | tee ../../out/typecheck.txt

      - name: Local copilot unit tests
        id: tests
        if: always()
        working-directory: apps/labbai
        run: |
          set -o pipefail
          bunx vitest run local-copilot lib/api-key lib/mothership/inbox --reporter=dot 2>&1 | tee ../../out/tests.txt

      - name: Outcomes
        if: always()
        run: printf 'tsc=%s\ntests=%s\n' "${{ steps.tsc.outcome }}" "${{ steps.tests.outcome }}" > out/outcomes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsc
          path: out/

      - name: Fail when a check failed
        if: steps.tsc.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (shard ${{ matrix.shard }}/3)
        id: run
        working-directory: apps/labbai
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
        run: |
          set -o pipefail
          mkdir -p ../../out
          NODE_OPTIONS=--max-old-space-size=8192 bunx vitest run --shard=${{ matrix.shard }}/3 --reporter=dot 2>&1 | tee ../../out/full-tests-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: out/

  # Same `next build` the app image runs, outside Docker so its output can be published.
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Next build (apps/labbai)
        id: build
        working-directory: apps/labbai
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3300
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          mkdir -p ../../out
          bun run build 2>&1 | tee ../../out/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: out/

  # Images are pushed as :<sha> only; `promote` moves :latest after every check passes.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/app.Dockerfile
            needs_swap: true
          - name: realtime
            dockerfile: docker/realtime.Dockerfile
            needs_swap: false
          - name: migrations
            dockerfile: docker/db.Dockerfile
            needs_swap: false
          - name: cron
            dockerfile: docker/cron.Dockerfile
            needs_swap: false
    steps:
      - uses: actions/checkout@v4

      # The app image's `next build` needs more memory than the 16 GB runner has.
      - name: Free disk space and add swap
        if: matrix.needs_swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/labbai-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3300' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  promote:
    needs: [tsc, tests, next-build, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag :latest
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in app realtime migrations cron; do
            ref="ghcr.io/${owner}/labbai-${name}"
            docker buildx imagetools create -t "${ref}:latest" "${ref}:${GITHUB_SHA}"
          done

  # Job logs need repo-admin auth to download; publish the results on public branches
  # so they can be read from raw.githubusercontent.com.
  report:
    needs: [tsc, tests, next-build, images, promote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only our report artifacts; build-push-action also uploads `.dockerbuild` records.
      - uses: actions/download-artifact@v4
        with:
          pattern: '{tsc,tests-*,next-build}'
          path: art

      - name: Publish ci-reports
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          git init -q && git checkout -q -b ci-reports
          A="$GITHUB_WORKSPACE/art"
          cp "$A/tsc/typecheck.txt" typecheck.txt 2>/dev/null || echo "no output" > typecheck.txt
          tail -c 200000 "$A/tsc/tests.txt" > tests.txt 2>/dev/null || echo "no output" > tests.txt
          tail -c 100000 "$A/tsc/install.txt" > install.txt 2>/dev/null || echo "no output" > install.txt
          cat "$A"/tests-*/full-tests-*.txt 2>/dev/null | grep -v '^\s*$' | tail -c 600000 > full-tests.txt || true
          [ -s full-tests.txt ] || echo "no output" > full-tests.txt
          grep -hE '(FAIL|✗|×) ' "$A"/tests-*/full-tests-*.txt 2>/dev/null | sort -u > full-tests-failed.txt || true
          tsc=$(sed -n 's/^tsc=//p' "$A/tsc/outcomes.txt" 2>/dev/null); tests=$(sed -n 's/^tests=//p' "$A/tsc/outcomes.txt" 2>/dev/null)
          printf 'sha=%s\ntsc=%s\ntests=%s\nfull_tests=%s\nnext_build=%s\nimages=%s\nlatest=%s\n' \
            "$GITHUB_SHA" "${tsc:-unknown}" "${tests:-unknown}" "${{ needs.tests.result }}" \
            "${{ needs.next-build.result }}" "${{ needs.images.result }}" "${{ needs.promote.result }}" > status.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-reports

      - name: Publish ci-build-report
        run: |
          mkdir -p /tmp/breport && cd /tmp/breport
          git init -q && git checkout -q -b ci-build-report
          tail -c 400000 "$GITHUB_WORKSPACE/art/next-build/build.txt" > build.txt 2>/dev/null || echo "no output" > build.txt
          printf 'sha=%s\nbuild=%s\n' "$GITHUB_SHA" "${{ needs.next-build.result }}" > status.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-build-report
