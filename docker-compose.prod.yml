# Labbai production stack (46.8.195.221, /home/ubuntu/labbai).
# The server also runs other projects: no published ports. Public hostnames are set
# in the Cloudflare dashboard on the `labbai-prod` tunnel (mehmonai-cloudflared, network
# `mehmonai_default`); the shared `edge` tunnel network is joined too, so the routes can
# be moved there without changing this file:
#   studio.labbai.uz path socket.io -> http://labbai-realtime:3002  (listed first)
#   studio.labbai.uz                -> http://labbai-app:3000
# NEXT_PUBLIC_SOCKET_URL is the app origin, so the socket is same-origin.
# Images are built by .github/workflows/build-images.yml and pulled from GHCR.
name: labbai
services:
  simstudio:
    image: ghcr.io/azizmubashirov/labbai-sim-simstudio:${LABBAI_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    # Local file storage (no S3 configured); host dir must be owned by uid 1001.
    volumes: ['/home/ubuntu/labbai/uploads:/app/apps/sim/uploads']
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL}
      - REDIS_URL=redis://redis:6379
      - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      realtime: {condition: service_started}
      uploads-init: {condition: service_completed_successfully}
    networks:
      default: {}
      edge: {aliases: [labbai-app]}
      mehmonai: {aliases: [labbai-app]}
    deploy: {resources: {limits: {memory: 1536M}}}

  uploads-init:
    image: alpine:3.21
    command: ['sh', '-c', 'mkdir -p /uploads/.staging /uploads/.multipart && chown -R 1001:1001 /uploads']
    volumes: ['/home/ubuntu/labbai/uploads:/uploads']
    restart: 'no'

  # Scheduled workflows, polling triggers, resume polling, outbox, KB connector sync.
  cron:
    image: ghcr.io/azizmubashirov/labbai-sim-cron:${LABBAI_TAG:-latest}
    restart: on-failure
    environment:
      - SIM_URL=http://simstudio:3000
      - CRON_SECRET=${CRON_SECRET}
      - TZ=Asia/Tashkent
    depends_on:
      simstudio: {condition: service_started}

  realtime:
    image: ghcr.io/azizmubashirov/labbai-sim-realtime:${LABBAI_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=WARN
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      default: {}
      edge: {aliases: [labbai-realtime]}
      mehmonai: {aliases: [labbai-realtime]}
    deploy: {resources: {limits: {memory: 384M}}}

  migrations:
    image: ghcr.io/azizmubashirov/labbai-sim-migrations:${LABBAI_TAG:-latest}
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
    depends_on:
      db: {condition: service_healthy}
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'
    profiles: ['setup']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 5s, retries: 5}

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=simstudio
    volumes: ['labbai_pg:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, timeout: 5s, retries: 5}

networks:
  edge:
    external: true
  mehmonai:
    name: mehmonai_default
    external: true

volumes:
  labbai_pg:
